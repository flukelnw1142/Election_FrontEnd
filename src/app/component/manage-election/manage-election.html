<div class="bg">
    <mat-tab-group class="custom-tabs" mat-stretch-tabs>
        <mat-tab *ngFor="let menu of menus" [label]="menu.MenuName">
            <ng-container *ngIf="menu.MenuID === 1">
                <div class="manage-container">
                    <div class="flex-column-container">
                        <div class="left">
                            <div class="manage-content">
                                <div class="set-auto-time">
                                    Set Auto Time <input type="number" min="1" step="1" value="2"> sec
                                    <mat-slide-toggle [checked]="checked"> </mat-slide-toggle>
                                </div>
                                <hr style="margin: 5px;">
                                <div class="update-data">
                                    <span>อัพเดทข้อมูล</span>

                                    <div class="percent-count">
                                        <span>นับไปแล้ว</span>
                                        <input type="text" class="form-control w-auto" placeholder="">
                                    </div>

                                    <div class="mt-3">
                                        <div class="row fw-bold">
                                            <div class="col-2">Rank</div>
                                            <div class="col-4">party_name</div>
                                            <div class="col-2">party_pic</div>
                                            <div class="col-4">score</div>
                                        </div>

                                        <div *ngFor="let rank of [1,2,3,4,5]" class="row mt-2 align-items-center">
                                            <div class="col-2">rank{{rank}} :</div>
                                            <div class="col-4"><input type="text" class="form-control"
                                                    placeholder="party_name">
                                            </div>
                                            <div class="col-2"><input type="text" class="form-control"
                                                    placeholder="party_pic">
                                            </div>
                                            <div class="col-4"><input type="text" class="form-control"
                                                    placeholder="score">
                                            </div>
                                        </div>
                                        <div class="d-flex justify-content-end mt-3">
                                            <button class="btn btn-primary">GEN JSON</button>
                                        </div>
                                    </div>

                                </div>
                            </div>
                        </div>
                        <div class="right">
                            <textarea class="form-control" readonly style="height: 100%; resize: none;"></textarea>
                        </div>
                    </div>
                </div>
            </ng-container>

            <ng-container *ngIf="menu.MenuID === 2">
                <form>
                    <label>Province:</label>
                    <input type="text">
                </form>
            </ng-container>

            <ng-container *ngIf="menu.MenuID === 3">
                <p>แสดง chart หรือข้อมูลอื่นๆ</p>
            </ng-container>
        </mat-tab>
    </mat-tab-group>

</div>
