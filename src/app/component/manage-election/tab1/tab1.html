<div class="manage-container">
    <div class="flex-column-container">
        <div class="left">
            <div class="manage-content">
                <div class="set-auto-time">
                    Set Auto Time <input type="number" min="1" step="1" [(ngModel)]="timeAuto" value="2"> sec
                    <mat-slide-toggle [(ngModel)]="checked" (change)="onToggleChange()">
                    </mat-slide-toggle>
                </div>
                <hr style="margin: 5px;">
                <div class="update-data">
                    <span>อัพเดทข้อมูล</span>

                    <div class="percent-count">
                        <span>นับไปแล้ว (%) <span class="ex-text">50.0</span></span>
                        <input type="number" class="form-control w-auto" placeholder="" [(ngModel)]="inputPercent"
                            name="inputPercent">
                    </div>

                    <div class="mt-3">
                        <div class="row fw-bold">
                            <div class="col-2">Rank</div>
                            <div class="col-4">party_name
                                <span class="ex-text">ชาติพัฒนากล้า</span>
                            </div>
                            <div class="col-2">party_pic
                                <span class="ex-text">01</span>
                            </div>
                            <div class="col-4">score
                                <span class="ex-text">7,000,000</span>
                            </div>
                        </div>
                        <form #rankForm="ngForm" (ngSubmit)="onSubmit(rankForm)">
                            <div *ngFor="let rank of ranks; let i = index" class="row mt-2 align-items-center">
                                <div class="col-2">rank{{i+1}} :</div>
                                <div class="col-4">
                                    <input type="text" class="form-control" placeholder="" [(ngModel)]="ranks[i].input1"
                                        name="input1-{{i}}" required>
                                </div>
                                <div class="col-2">
                                    <input type="text" class="form-control" placeholder="" [(ngModel)]="ranks[i].input2"
                                        name="input2-{{i}}" required>
                                </div>
                                <div class="col-4">
                                    <input type="text" class="form-control" placeholder="" [(ngModel)]="ranks[i].input3"
                                        name="input3-{{i}}" required>
                                </div>
                            </div>
                            <div class="d-flex justify-content-end mt-3">
                                <button class="btn btn-primary" type="submit">GEN JSON</button>
                            </div>

                        </form>
                    </div>

                </div>
            </div>
        </div>
        <div class="right">
            <textarea class="form-control" readonly
                style="height: 100%; resize: none; font-size: small;">{{responseJsonText}}</textarea>
        </div>
    </div>
</div>
