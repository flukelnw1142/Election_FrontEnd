<div style="position: relative;" class="show-province-all">
    <div class="glass-card card" style="color: white;">
        <div class="three-column-grid">
            <div class="column">
                <div class="region-tabs">
                    <p class="region-tab" *ngFor="let region of regionList" [class.active]="selectedRegion === region"
                        (click)="onRegionSelect(region)">
                        {{ region }}
                    </p>
                </div>


            </div>
            <div class="column">
                <div class="svg-container" #svgContainerRegion (click)="onSvgClickRegion($event)">
                    <!-- (mousemove)="onSvgMouseMove($event)" -->
                    <div class="region-map-wrapper">
                        <div [innerHTML]="svgContentRegion"></div>
                    </div>
                </div>
            </div>
            <div class="column">
                <div>
                    <div class="tab-content" style="margin-top: 20px;">
                        dashboard
                    </div>
                </div>

            </div>
        </div>
    </div>

</div>
